name: iOS

# No Mac needed: the iOS shell is compiled, signed and uploaded to TestFlight on GitHub's macOS runners.
# - Every change under ios/ gets a compile check (simulator build, no signing).
# - "Run workflow" with testflight=true signs with Apple-managed certificates and uploads to TestFlight.
#   Required repository secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (base64 of the .p8 file).
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: Sign and upload to TestFlight
        type: boolean
        default: false

jobs:
  compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build for simulator (no signing)
        working-directory: ios
        run: |
          xcodebuild -project CouchRemote.xcodeproj -scheme CouchRemote \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: compile
    runs-on: macos-latest
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; exit 1; fi
          done
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Archive (unsigned; signing happens at export)
        working-directory: ios
        run: |
          set -eo pipefail
          xcodebuild archive -project CouchRemote.xcodeproj -scheme CouchRemote             -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CouchRemote.xcarchive"             CODE_SIGNING_ALLOWED=NO             CURRENT_PROJECT_VERSION="${{ github.run_number }}" | tail -n 40
      - name: Export and upload to TestFlight
        working-directory: ios
        run: |
          set -eo pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CouchRemote.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 40
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
